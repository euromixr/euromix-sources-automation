name: EuroMix Scraper

on:
  schedule:
    # Run every 30 minutes (Safe now due to optimized script)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    # מונע הרצה של מספר instances במקביל
    concurrency:
      group: euromix-scraper
      cancel-in-progress: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'  # מאיץ את ההתקנה משמעותית

      - name: Install dependencies
        run: npm install

      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "🚀 Starting scraper at $(date)"
          node scraper.cjs
          echo "✅ Finished scraper at $(date)"
        
      - name: Notify on failure
        if: failure()
        run: echo "❌ Scraper failed! Check the logs above."
