name: EuroMix Scraper

on:
  schedule:
    # Run every 30 minutes (Safe now due to optimized script)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        # This installs packages defined in package.json
        run: npm install

      - name: Run Scraper
        env:
          # Direct injection of the secret to the process environment
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scraper.cjs
