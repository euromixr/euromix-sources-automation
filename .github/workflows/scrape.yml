name: Scrape Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🚀 Starting scraper at $(date)
        run: echo "🚀 Starting scraper at $(date)"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          # WordPress
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_IMPORT_ENDPOINT: ${{ secrets.WP_IMPORT_ENDPOINT }}

          # Scraper config
          HOURS_BACK: "24"
          IMPORT_CONCURRENCY: "3"
          BETWEEN_REQUEST_DELAY_MS: "150"
          REQUEST_TIMEOUT_MS: "30000"

          # Google Alerts RSS Feeds
          GOOGLE_ALERT_RSS_1: ${{ secrets.GOOGLE_ALERT_RSS_1 }}
          GOOGLE_ALERT_RSS_2: ${{ secrets.GOOGLE_ALERT_RSS_2 }}
