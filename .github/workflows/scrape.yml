name: EuroMix Scraper

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    concurrency:
      group: euromix-scraper
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WP_IMPORT_URL: ${{ secrets.WP_IMPORT_URL }}
          WP_IMPORT_SECRET: ${{ secrets.WP_IMPORT_SECRET }}
        run: |
          echo "🚀 Starting scraper at $(date)"
          node scraper.cjs
          echo "✅ Finished scraper at $(date)"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Scraper failed! Check the logs above."
