name: Daily Scraper

    on:
      schedule:
        # הרצה כל שעה עגולה (ניתן לשנות)
        - cron: '0 * * * *'
      workflow_dispatch: # מאפשר הרצה ידנית מהכפתור באפליקציה

    jobs:
      scrape:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v3

          - name: Setup Node.js
            uses: actions/setup-node@v3
            with:
              node-version: 18

          - name: Install dependencies
            run: npm install

          - name: Run Scraper
            env:
              # כאן אנחנו מזריקים את המפתח הסודי
              FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            run: node scraper.cjs
    ```

**שלב ג': הגדרת הסודות (Secrets)**
1.  לך ב-GitHub ללשונית **Settings** של ה-Repo שיצרת.
2.  בתפריט צד, בחר **Secrets and variables** > **Actions**.
3.  לחץ על **New repository secret**.
4.  בשם (Name): כתוב `FIREBASE_SERVICE_ACCOUNT`.
5.  בתוכן (Secret): הדבק את **כל התוכן** של קובץ ה-`service-account.json` שהורדת מפיירבייס.
6.  לחץ **Add secret**.

**שלב ד': יצירת Token להפעלה מרחוק (עבור האפליקציה)**
כדי שהכפתור "הפעל סריקה" באפליקציה יעבוד:
1.  לך להגדרות הפרופיל שלך בגיטהאב -> Developer Settings -> Personal access tokens -> Tokens (classic).
2.  צור טוקן חדש עם הרשאת `repo`.
3.  העתק את הטוקן הזה.
4.  לך לקובץ `App.jsx` בפרויקט הריאקט שלך, ועדכן את השורות האלו:
    ```javascript
    const TOKEN_SECRET = "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"; 
    const GITHUB_OWNER = "euromixr"; 
    const GITHUB_REPO = "euromix-sources-automation"; // השם של ה-Repo החדש
